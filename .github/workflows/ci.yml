name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# El workflow solo lee el repositorio: nada de tokens con permisos de escritura.
permissions:
  contents: read

# Si se empujan dos commits seguidos, la ejecucion vieja se cancela.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        # 22.13.0 es la primera version de la linea 22 donde node:sqlite ya no
        # exige --experimental-sqlite; con 22.5.0 los tests no podrian cargar
        # src/db.js. Ver `engines` en package.json.
        node: ["22.13.0", "24", "26"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      # No hay dependencias, pero npm ci valida el lockfile en cada soporte.
      - name: Instalar
        run: npm ci
      - name: Comprobar sintaxis
        run: npm run check
      - name: Ejecutar tests
        run: npm test
      # La cobertura repite la suite entera, asi que se calcula una sola vez.
      - name: Cobertura
        if: runner.os == 'Linux' && matrix.node == '26'
        run: npm run coverage
      # El paquete publicado debe llevar docs, assets, iconos y la version
      # alineada con el manifest de la extension.
      - name: Verificar el paquete
        if: runner.os == 'Linux' && matrix.node == '26'
        run: |
          npm pack --dry-run
          node -e "const fs=require('fs');const p=JSON.parse(fs.readFileSync('package.json','utf8'));const m=JSON.parse(fs.readFileSync('extension/manifest.json','utf8'));if(p.version!==m.version){console.error('version distinta: paquete '+p.version+' vs extension '+m.version);process.exit(1)}for(const f of ['assets/banner.svg','assets/logo.svg','extension/icons/icon128.png','docs/API.md','docs/ARQUITECTURA.md','CITATION.cff'])if(!fs.existsSync(f)){console.error('falta '+f);process.exit(1)}console.log('paquete coherente')"
