name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# El workflow solo lee el repositorio: nada de tokens con permisos de escritura.
permissions:
  contents: read

# Si se empujan dos commits seguidos, la ejecucion vieja se cancela.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        # 22.13.0 es la primera version de la linea 22 donde node:sqlite ya no
        # exige --experimental-sqlite; con 22.5.0 los tests no podrian cargar
        # src/db.js. Ver `engines` en package.json.
        node: ["22.13.0", "24"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      # No hay dependencias, pero npm ci valida el lockfile en cada soporte.
      - name: Instalar
        run: npm ci
      - name: Comprobar sintaxis
        run: npm run check
      - name: Ejecutar tests
        run: npm test
      # La cobertura repite la suite entera, asi que se calcula una sola vez.
      - name: Cobertura
        if: runner.os == 'Linux' && matrix.node == '24'
        run: npm run coverage
