<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <style>
      :root {
        color-scheme: dark light;
        font: 13px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      }
      body {
        width: 280px;
        margin: 0;
        padding: 14px;
        background: #0f1115;
        color: #e6e9ef;
      }
      h1 {
        font-size: 14px;
        margin: 0 0 10px;
      }
      button {
        width: 100%;
        padding: 9px;
        margin-bottom: 6px;
        border-radius: 8px;
        border: 1px solid #2a2f3a;
        background: #1e222b;
        color: inherit;
        font-size: 13px;
        cursor: pointer;
      }
      button.primary {
        background: #4cc38a;
        border-color: #2f7d5b;
        color: #04160d;
        font-weight: 600;
      }
      button:disabled {
        opacity: 0.55;
      }
      label {
        display: block;
        color: #9aa3b2;
        margin: 10px 0 4px;
      }
      input {
        width: 100%;
        padding: 7px 9px;
        border-radius: 8px;
        border: 1px solid #2a2f3a;
        background: #171a21;
        color: inherit;
        box-sizing: border-box;
      }
      #status {
        min-height: 18px;
        color: #9aa3b2;
        font-size: 12px;
        margin-top: 6px;
      }
      #status.ok {
        color: #4cc38a;
      }
      #status.err {
        color: #e06c75;
      }
    </style>
  </head>
  <body>
    <h1>🔍 Guardar en Memex</h1>
    <button class="primary" id="save-page">Guardar página actual</button>
    <button id="save-selection">Guardar selección</button>
    <label for="server">Servidor Memex</label>
    <input id="server" type="text" spellcheck="false" />
    <div id="status"></div>
    <script type="module" src="popup.js"></script>
  </body>
</html>
